[project]
name = "netback-calculator"
version = "0.3.0"
description = "Freight rate netback / landed cost calculator for bulk and tanker commodity trades"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.50",
    "plotly>=5.20",
    "pydantic>=2.6",
    "pandas>=2.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netback = ["data/reference/*.json"]
